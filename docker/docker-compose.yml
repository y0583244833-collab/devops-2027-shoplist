services:
  # מסד הנתונים שומר את המוצרים ומקבל בקשות מהשרת.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shoplist
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shopuser", "-d", "shoplist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # שרת המוצרים קורא נתונים מ־postgres ושומר בו שינויים.
  backend:
    build:
      context: ../app/backend
    environment:
      DB_HOST: postgres
      DB_NAME: shoplist
      DB_USER: shopuser
      DB_PASSWORD: shoppass
    depends_on:
      postgres:
        condition: service_healthy

  # שירות הסטטיסטיקות מבקש את נתוני המוצרים מהשרת.
  stats:
    build:
      context: ../app/stats
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend

  # שרת האתר מקבל בקשות מהדפדפן ומעביר אותן ל־backend או ל־stats לפי הנתיב.
  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile.multistage
    ports:
      - "8080:80"
    depends_on:
      - backend
      - stats

volumes:
  postgres-data:
